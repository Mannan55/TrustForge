services:
  - type: web
    name: trustforge-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_MODE
        value: supabase
      - key: SUPABASE_URL
        value: https://bnpxutwmdqsoyefppwpl.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://trustforge.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: TRUSTFORGE_LLM_MODEL
        value: "qwen/qwen3.8-27b"
      - key: EMBEDDING_SERVICE_URL
        value: "http://127.0.0.1:8008/embed"
      - key: EMBEDDING_HEALTH_URL
        value: "http://127.0.0.1:8008/health"
