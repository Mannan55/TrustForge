name: TrustForge Release Integrity & Hardening CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Regression & Integrity Verification
    runs-on: ubuntu-latest
    env:
      ALLOW_PAID_INFERENCE: 'false'
      SERVER_PAID_INFERENCE_AUTHORIZED: 'false'
      NODE_ENV: 'test'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Generate ephemeral CI-only authentication secret
        shell: bash
        run: |
          secret="$(python3 -c 'import secrets; print(secrets.token_hex(48))')"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            TrustForge Frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio pydantic pydantic-settings numpy

      - name: Run Python Backend Verification Suite
        run: |
          python -m pytest backend

      - name: Install API Dependencies
        run: |
          npm --prefix api ci

      - name: Compile API TypeScript
        run: |
          npm --prefix api run build

      - name: Run Full API Regression & Wire Acceptance Suite
        run: |
          npm --prefix api test

      - name: Install Frontend Dependencies
        run: |
          npm --prefix "TrustForge Frontend" ci

      - name: Build React Frontend
        run: |
          npm --prefix "TrustForge Frontend" run build

      - name: Upload Production Documentation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-documentation-artifacts
          path: |
            docs/SYSTEM_DOCUMENTATION.pdf
            docs/SETUP_AND_RUN.md
          if-no-files-found: warn
