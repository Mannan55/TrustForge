name: TrustForge Release Integrity & Hardening CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Regression & Integrity Verification
    runs-on: ubuntu-latest
    env:
      ALLOW_PAID_INFERENCE: 'false'
      SERVER_PAID_INFERENCE_AUTHORIZED: 'false'
      NODE_ENV: 'test'
      AUTH_SECRET: 'trustforge_production_grade_hmac_sha256_audit_secret_key_2026_dr_neelam_naik_dpdp'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: TrustForge/api/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio

      - name: Run Python Backend Verification Suite
        run: |
          python -m pytest TrustForge/backend

      - name: Install API Dependencies
        run: |
          npm --prefix TrustForge/api ci

      - name: Compile API TypeScript
        run: |
          npm --prefix TrustForge/api run build

      - name: Run Full API Regression & Wire Acceptance Suite
        run: |
          npm --prefix TrustForge/api test

      - name: Install Frontend Dependencies
        run: |
          npm --prefix "TrustForge/TrustForge Frontend" ci

      - name: Build React Frontend
        run: |
          npm --prefix "TrustForge/TrustForge Frontend" run build

      - name: Upload Verified Release Documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-verification-artifacts
          path: |
            TrustForge/docs/research-implementation/24_STAGE3_RELEASE_GATES.md
            TrustForge/TrustDocumentation/stage3_screenshots/
          if-no-files-found: warn
