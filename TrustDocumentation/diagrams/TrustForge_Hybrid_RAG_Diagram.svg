<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="100%" height="100%" style="background:#0F172A;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <text x="550" y="40" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800" letter-spacing="0.5">HYBRID STATUTORY RAG RETRIEVAL ARCHITECTURE</text>
  <text x="550" y="65" text-anchor="middle" fill="#94A3B8" font-size="12">Combining Sparse BM25 Lexical Retrieval and Dense pgvector Semantic Embeddings via RRF (k=60)</text>

  <!-- Query Input -->
  <g transform="translate(425, 95)" filter="url(#shadow)">
    <rect width="250" height="50" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="125" y="22" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="700">Audit Compliance Query</text>
    <text x="125" y="40" text-anchor="middle" fill="#94A3B8" font-size="9.5">e.g., "privacy notice itemisation under section 5"</text>
  </g>

  <!-- Branch lines -->
  <line x1="450" y1="145" x2="250" y2="190" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="145" x2="850" y2="190" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Left: Path A - BM25 -->
  <g transform="translate(100, 200)" filter="url(#shadow)">
    <rect width="320" height="210" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="320" height="30" rx="8" fill="#B45309"/>
    <text x="160" y="20" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">PATH A: BM25 Lexical Search</text>
    <text x="20" y="55" fill="#E2E8F0" font-size="10" font-weight="600">• In-Process Token Inverted Index</text>
    <text x="35" y="75" fill="#94A3B8" font-size="9">Sub-millisecond latency (&lt; 1 ms)</text>
    <text x="20" y="98" fill="#E2E8F0" font-size="10" font-weight="600">• Statutory Designation Boosting</text>
    <text x="35" y="118" fill="#94A3B8" font-size="9">Section / Rule tokens boosted 2.5x</text>
    <text x="20" y="141" fill="#E2E8F0" font-size="10" font-weight="600">• Exact Keyword Matching</text>
    <text x="35" y="161" fill="#34D399" font-size="9.5" font-weight="600">Hit@1 = 68.9% on verbatim statutory terms</text>
    <text x="35" y="180" fill="#94A3B8" font-size="9">Output: Lexical Rank List R_BM25</text>
  </g>

  <!-- Right: Path B - pgvector -->
  <g transform="translate(680, 200)" filter="url(#shadow)">
    <rect width="320" height="210" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect width="320" height="30" rx="8" fill="#6D28D9"/>
    <text x="160" y="20" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">PATH B: Dense Semantic pgvector</text>
    <text x="20" y="55" fill="#E2E8F0" font-size="10" font-weight="600">• all-MiniLM-L6-v2 Embedding Model</text>
    <text x="35" y="75" fill="#94A3B8" font-size="9">Normalized 384-dimensional query vector</text>
    <text x="20" y="98" fill="#E2E8F0" font-size="10" font-weight="600">• HNSW Index on Supabase PostgreSQL</text>
    <text x="35" y="118" fill="#94A3B8" font-size="9">Distance metric: 1 - Cosine Distance</text>
    <text x="20" y="141" fill="#E2E8F0" font-size="10" font-weight="600">• Semantic Synonym Mapping</text>
    <text x="35" y="161" fill="#34D399" font-size="9.5" font-weight="600">Hit@5 = 75.6% on conceptual descriptions</text>
    <text x="35" y="180" fill="#94A3B8" font-size="9">Output: Dense Vector Rank List R_vec</text>
  </g>

  <!-- Merge lines -->
  <line x1="260" y1="410" x2="450" y2="465" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="410" x2="650" y2="465" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RRF Fusion Box -->
  <g transform="translate(300, 460)" filter="url(#shadow)">
    <rect width="500" height="110" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect width="500" height="28" rx="8" fill="#047857"/>
    <text x="250" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">Reciprocal Rank Fusion (k = 60) with Non-Normative Dampening</text>
    <text x="250" y="50" text-anchor="middle" fill="#E2E8F0" font-size="10" font-family="monospace">RRF(d) = 1/(60 + rank_BM25(d)) + 1/(60 + rank_vec(d))</text>
    <text x="250" y="70" text-anchor="middle" fill="#F87171" font-size="9.5">Non-Normative Dampening: 0.35x multiplier on Sec 40 &amp; 44 Penalty Schedules</text>
    <text x="250" y="92" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700">Final Top-5 Hit Recall = 84.4% • MRR@5 = 0.656 • NDCG@5 = 0.653</text>
  </g>
</svg>
