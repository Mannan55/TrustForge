<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background:#0F172A;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <text x="550" y="35" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800" letter-spacing="0.5">DETERMINISTIC TRUST SCORE CALCULATION &amp; POSTURE MAPPING</text>
  <text x="550" y="60" text-anchor="middle" fill="#94A3B8" font-size="12">Mathematical Pipeline: Control Multipliers, Pillar Aggregation, Normalization, and Institutional Bands</text>

  <!-- Level 1: 20 Canonical Controls & Evidence Multipliers -->
  <g transform="translate(50, 95)" filter="url(#shadow)">
    <rect width="1000" height="110" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <rect width="1000" height="26" rx="8" fill="#1D4ED8"/>
    <text x="500" y="18" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">LEVEL 1: CONTROL MULTIPLIERS (20 CANONICAL DPDP CONTROLS)</text>
    
    <g transform="translate(30, 42)">
      <rect x="0" y="0" width="210" height="50" rx="6" fill="#0F172A" stroke="#10B981"/>
      <text x="105" y="20" text-anchor="middle" fill="#34D399" font-size="10.5" font-weight="700">SUPPORTED (PASS)</text>
      <text x="105" y="38" text-anchor="middle" fill="#E2E8F0" font-size="10">Multiplier: 1.0 (Full Weight)</text>

      <rect x="240" y="0" width="220" height="50" rx="6" fill="#0F172A" stroke="#F59E0B"/>
      <text x="350" y="20" text-anchor="middle" fill="#FBBF24" font-size="10.5" font-weight="700">POTENTIAL_GAP (PARTIAL)</text>
      <text x="350" y="38" text-anchor="middle" fill="#E2E8F0" font-size="10">Multiplier: 0.5 (Half Weight)</text>

      <rect x="490" y="0" width="220" height="50" rx="6" fill="#0F172A" stroke="#60A5FA"/>
      <text x="600" y="20" text-anchor="middle" fill="#60A5FA" font-size="10.5" font-weight="700">INSUFFICIENT_EVIDENCE</text>
      <text x="600" y="38" text-anchor="middle" fill="#E2E8F0" font-size="10">Multiplier: 0.3 (Cautious Baseline)</text>

      <rect x="740" y="0" width="200" height="50" rx="6" fill="#0F172A" stroke="#EF4444"/>
      <text x="840" y="20" text-anchor="middle" fill="#F87171" font-size="10.5" font-weight="700">NOT_SUPPORTED (FAIL)</text>
      <text x="840" y="38" text-anchor="middle" fill="#E2E8F0" font-size="10">Multiplier: 0.0 (Zero Earned)</text>
    </g>
  </g>

  <!-- Down arrow -->
  <line x1="550" y1="205" x2="550" y2="235" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 2: 6 Statutory Pillars -->
  <g transform="translate(50, 240)" filter="url(#shadow)">
    <rect width="1000" height="130" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect width="1000" height="26" rx="8" fill="#6D28D9"/>
    <text x="500" y="18" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">LEVEL 2: SIX STATUTORY PRIVACY PILLARS (SUM OF WEIGHTS = 1.00)</text>

    <g transform="translate(20, 38)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="150" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
      <text x="75" y="18" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">Privacy Architecture</text>
      <text x="75" y="34" text-anchor="middle" fill="#C084FC" font-size="9.5" font-weight="600">Weight: 0.20</text>
      <text x="75" y="52" text-anchor="middle" fill="#94A3B8" font-size="8.5">5 Controls (Sec 4, 5, 6)</text>
      <text x="75" y="66" text-anchor="middle" fill="#94A3B8" font-size="8.5">Notice, Consent, Purpose</text>

      <!-- Pillar 2 -->
      <rect x="160" y="0" width="150" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
      <text x="235" y="18" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">Security Safeguards</text>
      <text x="235" y="34" text-anchor="middle" fill="#C084FC" font-size="9.5" font-weight="600">Weight: 0.20</text>
      <text x="235" y="52" text-anchor="middle" fill="#94A3B8" font-size="8.5">4 Controls (Sec 8(5), 8(6))</text>
      <text x="235" y="66" text-anchor="middle" fill="#94A3B8" font-size="8.5">Encryption, Breach Plan</text>

      <!-- Pillar 3 -->
      <rect x="320" y="0" width="150" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
      <text x="395" y="18" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">Transparency &amp; Notice</text>
      <text x="395" y="34" text-anchor="middle" fill="#C084FC" font-size="9.5" font-weight="600">Weight: 0.15</text>
      <text x="395" y="52" text-anchor="middle" fill="#94A3B8" font-size="8.5">2 Controls (Sec 5(1), 8(9))</text>
      <text x="395" y="66" text-anchor="middle" fill="#94A3B8" font-size="8.5">DPO Contact, Sharing</text>

      <!-- Pillar 4 -->
      <rect x="480" y="0" width="150" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
      <text x="555" y="18" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">Governance &amp; DPO</text>
      <text x="555" y="34" text-anchor="middle" fill="#C084FC" font-size="9.5" font-weight="600">Weight: 0.15</text>
      <text x="555" y="52" text-anchor="middle" fill="#94A3B8" font-size="8.5">3 Controls (Sec 8(2), 9, R7)</text>
      <text x="555" y="66" text-anchor="middle" fill="#94A3B8" font-size="8.5">Processors, Children</text>

      <!-- Pillar 5 -->
      <rect x="640" y="0" width="150" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
      <text x="715" y="18" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">Data Lifecycle</text>
      <text x="715" y="34" text-anchor="middle" fill="#C084FC" font-size="9.5" font-weight="600">Weight: 0.15</text>
      <text x="715" y="52" text-anchor="middle" fill="#94A3B8" font-size="8.5">3 Controls (Sec 4(2), 8(7))</text>
      <text x="715" y="66" text-anchor="middle" fill="#94A3B8" font-size="8.5">Retention, Minimisation</text>

      <!-- Pillar 6 -->
      <rect x="800" y="0" width="160" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
      <text x="880" y="18" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">Data Principal Rights</text>
      <text x="880" y="34" text-anchor="middle" fill="#C084FC" font-size="9.5" font-weight="600">Weight: 0.15</text>
      <text x="880" y="52" text-anchor="middle" fill="#94A3B8" font-size="8.5">3 Controls (Sec 11, 12, 13)</text>
      <text x="880" y="66" text-anchor="middle" fill="#94A3B8" font-size="8.5">Access, Correction, Grievance</text>
    </g>
  </g>

  <!-- Down arrow -->
  <line x1="550" y1="370" x2="550" y2="400" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 3: Formula & Normalization -->
  <g transform="translate(150, 405)" filter="url(#shadow)">
    <rect width="800" height="85" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect width="800" height="24" rx="8" fill="#047857"/>
    <text x="400" y="17" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">LEVEL 3: MATHEMATICAL NORMALIZATION FORMULA</text>
    <text x="400" y="48" text-anchor="middle" fill="#E2E8F0" font-size="11" font-family="monospace">
      Pillar Score = (Sum(Earned Weight) / Sum(Applicable Weight)) * 100
    </text>
    <text x="400" y="70" text-anchor="middle" fill="#38BDF8" font-size="11" font-family="monospace">
      Trust Score = Round(Sum(Pillar Score_p * Weight_p) / Total Effective Weight, 2)
    </text>
  </g>

  <!-- Down arrow -->
  <line x1="550" y1="490" x2="550" y2="520" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 4: Posture Bands -->
  <g transform="translate(150, 525)" filter="url(#shadow)">
    <rect width="800" height="100" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <rect width="800" height="24" rx="8" fill="#0369A1"/>
    <text x="400" y="17" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">LEVEL 4: INSTITUTIONAL POSTURE BAND MAPPING</text>

    <g transform="translate(30, 38)">
      <rect x="0" y="0" width="170" height="50" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <text x="85" y="20" text-anchor="middle" fill="#34D399" font-size="10" font-weight="700">Strong Alignment</text>
      <text x="85" y="38" text-anchor="middle" fill="#E2E8F0" font-size="10">Score &gt;= 80.0</text>

      <rect x="190" y="0" width="170" height="50" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="275" y="20" text-anchor="middle" fill="#60A5FA" font-size="10" font-weight="700">Needs Attention</text>
      <text x="275" y="38" text-anchor="middle" fill="#E2E8F0" font-size="10">65.0 &lt;= Score &lt; 80.0</text>

      <rect x="380" y="0" width="170" height="50" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="465" y="20" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="700">Potential Gaps</text>
      <text x="465" y="38" text-anchor="middle" fill="#E2E8F0" font-size="10">50.0 &lt;= Score &lt; 65.0</text>

      <rect x="570" y="0" width="170" height="50" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="655" y="20" text-anchor="middle" fill="#F87171" font-size="10" font-weight="700">Critical</text>
      <text x="655" y="38" text-anchor="middle" fill="#E2E8F0" font-size="10">Score &lt; 50.0</text>
    </g>
  </g>
</svg>
