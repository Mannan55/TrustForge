<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background:#0F172A;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800" letter-spacing="0.5">TRUSTFORGE COMPLETE 10-STEP ASSESSMENT WORKFLOW</text>
  <text x="600" y="65" text-anchor="middle" fill="#94A3B8" font-size="12">End-to-End Pipeline: URL Intake to Evidence Extraction, RAG, Parallel Inference, Consensus, and PDF</text>

  <!-- Step 1 to 5 (Row 1) -->
  <g transform="translate(40, 100)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#1D4ED8"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1. URL Intake &amp; SSRF</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">Input: Target Web URL</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• Domain DNS resolution</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• SSRF loopback defense</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• Port &amp; protocol check</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: Validated Domain</text>
    </g>

    <!-- Arrow 1-2 -->
    <line x1="205" y1="90" x2="225" y2="90" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(230, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#0E7490"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2. Playwright Crawl</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">Headless Chromium</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• robots.txt permission</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• Traverses up to 5 URLs</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• Cookie banner capture</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: Raw DOM &amp; Headers</text>
    </g>

    <!-- Arrow 2-3 -->
    <line x1="435" y1="90" x2="455" y2="90" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <g transform="translate(460, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#047857"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">3. Evidence Extraction</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">8 Public Indicators</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• Privacy policy text</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• DPO contact publishing</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• HTTPS / Security headers</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: Extracted Evidence</text>
    </g>

    <!-- Arrow 3-4 -->
    <line x1="665" y1="90" x2="685" y2="90" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <g transform="translate(690, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#B45309"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">4. 20 Controls Mapping</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">6 Governance Pillars</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• Privacy Architecture (5)</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• Security Safeguards (4)</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• Rights, Gov, Notice (11)</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: 20 Audit Queries</text>
    </g>

    <!-- Arrow 4-5 -->
    <line x1="895" y1="90" x2="915" y2="90" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 5 -->
    <g transform="translate(920, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#6D28D9"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">5. Hybrid Statutory RAG</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">83 Statutory Chunks</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• BM25 Lexical + Token boost</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• all-MiniLM-L6-v2 (384d)</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• RRF (k=60) + 0.35x damp</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: Top-5 Legal Chunks</text>
    </g>
  </g>

  <!-- Turn Connector -->
  <path d="M 1060 290 L 1060 330 L 140 330 L 140 370" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 to 10 (Row 2) -->
  <g transform="translate(40, 380)">
    <!-- Step 6 -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#BE185D"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">6. Parallel LLM Inference</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">Frozen Context &amp; Hash</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• Promise.allSettled dispatch</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• M01, M02, M03 on Groq</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• 2.48x concurrent speedup</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: Candidate Findings</text>
    </g>

    <!-- Arrow 6-7 -->
    <line x1="205" y1="90" x2="225" y2="90" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 7 -->
    <g transform="translate(230, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#4338CA"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">7. Grounding Validator</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">Anti-Hallucination Filter</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• Citation chunk lookup</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• Flags foreign statutes</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• Computes grounding rate</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: Grounded Findings</text>
    </g>

    <!-- Arrow 7-8 -->
    <line x1="435" y1="90" x2="455" y2="90" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 8 -->
    <g transform="translate(460, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#F97316" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#C2410C"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">8. Top-3 Consensus</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">Majority Voting Matrix</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• Control-level aggregation</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• 2/3 agreement resolution</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• Conservative tie-break</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: Consensus Verdicts</text>
    </g>

    <!-- Arrow 8-9 -->
    <line x1="665" y1="90" x2="685" y2="90" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 9 -->
    <g transform="translate(690, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#047857"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">9. Trust Score Engine</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">Multi-Pillar Index</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• 6 Pillar weight sums</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• Multipliers: 1.0, 0.5, 0.3</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• Posture: Strong to Critical</text>
      <text x="15" y="145" fill="#38BDF8" font-size="9.5" font-weight="600">Output: Trust Score [0-100]</text>
    </g>

    <!-- Arrow 9-10 -->
    <line x1="895" y1="90" x2="915" y2="90" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 10 -->
    <g transform="translate(920, 0)" filter="url(#shadow)">
      <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <rect width="200" height="28" rx="8" fill="#1D4ED8"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">10. Persistence &amp; PDF</text>
      <text x="15" y="55" fill="#E2E8F0" font-size="10" font-weight="600">Deliverables Generated</text>
      <text x="15" y="75" fill="#94A3B8" font-size="9">• Supabase sync + RLS</text>
      <text x="15" y="93" fill="#94A3B8" font-size="9">• Durable local store cache</text>
      <text x="15" y="111" fill="#94A3B8" font-size="9">• Native PDF report stream</text>
      <text x="15" y="145" fill="#34D399" font-size="9.5" font-weight="600">Output: %PDF- Certificate</text>
    </g>
  </g>
</svg>
